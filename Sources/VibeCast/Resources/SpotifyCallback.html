<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VibeCast - {{TITLE}}</title>
  <link rel="icon" href="data:image/png;base64,{{LOGO}}">
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px;
      background: #080a0d; color: #f2f6fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 560px; text-align: center; }
    .panel { position: relative; padding: 40px 36px 36px; border: 1px solid #314650; border-radius: 8px;
      background: #101418; box-shadow: 0 0 64px #30cddd12, 0 24px 80px #0008; }
    .logo { display: block; width: 112px; height: 112px; object-fit: contain; margin: 0 auto 18px; mix-blend-mode: screen; }
    h1 { font-size: 34px; line-height: 1.15; font-weight: 650; margin: 0 0 26px; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: #91e2d7; margin: 0 0 20px; }
    .dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }
    h2 { font-size: 24px; line-height: 1.25; font-weight: 550; margin: 0 0 12px; }
    .message { font-size: 16px; line-height: 1.7; color: #aebbc5; margin: 0 auto; max-width: 410px; }
    .next { border-top: 1px solid #ffffff12; padding-top: 22px; margin: 28px 0 0; font-size: 13px; line-height: 1.7; color: #d0dbe2; }
    footer { color: #84919c; font-size: 12px; line-height: 1.7; margin-top: 24px; }
    body[data-state="denied"] .status, body[data-state="expired"] .status { color: #f2c68d; }
    @media (max-width: 420px) { .panel { padding: 28px 22px; } h1 { font-size: 30px; } h2 { font-size: 22px; } .logo { width: 96px; height: 96px; } }
    @media (prefers-reduced-transparency: reduce) { .panel { box-shadow: none; } }
  </style>
</head>
<body data-state="{{STATE}}">
  <main>
    <section class="panel" aria-labelledby="brand">
      <img class="logo" src="data:image/png;base64,{{LOGO}}" alt="" width="112" height="112">
      <h1 id="brand">VibeCast</h1>
      <p class="status"><span class="dot" aria-hidden="true"></span>{{STATUS}}</p>
      <h2>{{TITLE}}</h2>
      <p class="message">{{MESSAGE}}</p>
      <p class="next">{{NEXT}}</p>
    </section>
    <footer>Spotify connection &middot; Secure handoff to your Mac</footer>
  </main>
</body>
</html>
